description=Companion for a clan that runs the Sable Discord bot. Reports your drops, collection log, pets, diaries, combat tasks, quests, kill counts and personal bests to the clan's bot, and shows your clan points, rank progress, recent points and all clan ranks in a side panel. Can relay the clan chat to Discord. Needs the address and key the clan's bot gives you.
tags=clan,discord,sable,drops,pb,kill count
plugins=com.sable.SablePlugin
warning=This plugin only works with a clan that runs the Sable Discord bot, and sends data to that clan's server, at the address you type in. Nothing is sent until you enter both the address and your key. It sends your character name and your in-game events (drops, collection log, pets, diaries, combat tasks, quests, kill counts, personal bests). For group boss drops and personal bests it also sends the names of the clan members in your raid or instance, and only how many other players were there, not who they were. If your key belongs to clan staff, it also sends the clan's member list (names, ranks and join dates) so the clan's Wise Old Man group can be kept in step. It sends each clan chat line you see, who said it, what they said and the account type icon beside their name, to the clan's Discord channel (Relay Clan Chat To Discord, on by default, and you can switch it off); it never writes into the clan chat. Discord replies are shown only in your own game chat. The panel downloads the clan's small rank pictures from Discord's image servers (cdn.discordapp.com), and its links open Discord pages in your browser. The data goes to the clan's own server, not to RuneLite or to any third party.
