plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	// Only for runClient, which starts RuneLite with the plugin loaded.
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

	// The parser is plain Java, so its tests need nothing from RuneLite.
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'com.google.code.gson:gson:2.10.1'
}

group = 'com.sable'
version = '1.0'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

task runClient(type: JavaExec) {
	group = 'sable'
	description = 'Starts RuneLite in developer mode with the Sable plugin loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.sable.SablePluginTest'
	args '--developer-mode', '--debug'
	jvmArgs '-ea'
}
